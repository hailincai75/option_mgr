# Profile "e2e" (Playwright suite only): enables POST /api/test-support/reset and forces a fresh in-memory H2.
# Activate with SPRING_PROFILES_ACTIVE=e2e or --spring.profiles.active=e2e. Never use it for real data.
# Safeguard: startup fails if the effective spring.datasource.url (e.g. overridden by SPRING_DATASOURCE_URL)
# is not jdbc:h2:mem:... (see com.optionmgr.testsupport.E2eDatasourceGuard).
spring:
  datasource:
    url: jdbc:h2:mem:e2e;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
optionmgr:
  finnhub:
    # FEAT-009: never call the real Finnhub in E2E runs (POST /api/test-support/trading-calendar/fetch simulates it)
    fetch-enabled: false
    read-system-env: false
    env-files: ["build/no-env-in-e2e/.env"]
    base-url: http://127.0.0.1:9
  quotes:
    # FEAT-016: never call the real CBOE / Finnhub in E2E runs; fake sources via PUT /api/test-support/market-data/sources
    fetch-enabled: false
    transport: in-memory
    cboe-base-url: http://127.0.0.1:9
