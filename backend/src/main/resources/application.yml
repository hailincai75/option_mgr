server:
  port: 8080
  error:
    # Never leak internals through Boot's fallback /error page either.
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: option-mgr
  datasource:
    # File-based H2 under backend/data/ (git-ignored). Path is relative to the working dir: run from backend/.
    url: jdbc:h2:file:./data/optionmgr;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    # Schema is owned exclusively by Flyway; Hibernate only validates.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

optionmgr:
  finnhub:
    # FEAT-009: market holidays. The key is FINNHUB_API_KEY from the environment or the project-root .env
    # (never put the key here). Fetched at startup and daily at 08:00 New York.
    base-url: https://finnhub.io
    env-files: [".env", "../.env"]
    fetch-enabled: true
  quotes:
    # FEAT-016 / FEAT-052: option quotes from Yahoo Finance (default) or CBOE (option-source), Finnhub price fallback (key
    # as for optionmgr.finnhub). 10:00-16:00 on the hour + 16:20 New York on trading days (Q270), and once at startup
    # inside 09:30-16:20.
    fetch-enabled: true
    transport: http
    cboe-base-url: https://cdn-api.cboe.com
    index-symbols: [SPX, SPXW, NDX, NDXP, RUT, RUTW, VIX, VIXW, XSP, DJX, OEX, XEO]
    # FEAT-052 Q261: yahoo | cboe (the CBOE code is kept, off by default)
    option-source: yahoo
    # FEAT-052 Q263: annual risk-free rate in percent (0-20) for the Black-Scholes Greeks; used from the next quote write
    risk-free-rate-percent: 4.00
    # FEAT-052: pause between two Yahoo requests
    request-interval-millis: 1000
    yahoo:
      base-url: https://query2.finance.yahoo.com
      cookie-url: https://fc.yahoo.com/
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
