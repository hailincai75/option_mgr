server:
  port: 8080
  error:
    # Never leak internals through Boot's fallback /error page either.
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: option-mgr
  datasource:
    # File-based H2 under backend/data/ (git-ignored). Path is relative to the working dir: run from backend/.
    url: jdbc:h2:file:./data/optionmgr;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    # Schema is owned exclusively by Flyway; Hibernate only validates.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**
