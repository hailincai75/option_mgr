# Active for every Gradle test run (see build.gradle.kts): in-memory H2, isolated from the dev file DB.
spring:
  datasource:
    url: jdbc:h2:mem:optionmgr-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
optionmgr:
  finnhub:
    # FEAT-009: tests never call the real Finnhub nor read the real key; a test that needs a fetch points base-url at
    # a fake server and env-files at its own .env file.
    fetch-enabled: false
    read-system-env: false
    env-files: ["build/no-env-in-tests/.env"]
    base-url: http://127.0.0.1:9
  quotes:
    # FEAT-016: tests never call the real CBOE / Finnhub; a test that needs fetches uses transport in-memory
    # (InMemoryQuoteTransport) or points cboe-base-url at a fake server.
    fetch-enabled: false
    transport: http
    cboe-base-url: http://127.0.0.1:9
